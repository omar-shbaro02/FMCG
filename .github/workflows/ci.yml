name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fmcg
          POSTGRES_USER: fmcg
          POSTGRES_PASSWORD: fmcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmcg -d fmcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fmcg:fmcg@localhost:5432/fmcg
      SECRET_KEY: ci-only-secret-key-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './backend[dev]' pip-audit
      - run: pip-audit --skip-editable
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
