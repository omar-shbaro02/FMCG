services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fmcg
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: fmcg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmcg -d fmcg"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - uploads_data:/app/var/uploads
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.workers"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  uploads_data:
